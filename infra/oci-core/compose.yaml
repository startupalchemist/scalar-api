name: txl-core
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    mem_limit: 2g
    cpus: 0.8
    command: [postgres, -c, max_connections=60, -c, shared_buffers=256MB, -c, log_statement=none]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &logs
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: [valkey-server, --maxmemory, 256mb, --maxmemory-policy, noeviction, --appendonly, "yes"]
    volumes: [valkeydata:/data]
    networks: [data]
    mem_limit: 384m
    cpus: 0.2
    logging: *logs
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=2GB]
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./alerts.yml:/etc/prometheus/alerts.yml:ro, promdata:/prometheus]
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitor]
    mem_limit: 512m
    cpus: 0.3
    logging: *logs
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes: [./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro, alertdata:/alertmanager]
    ports: ["127.0.0.1:9093:9093"]
    networks: [monitor]
    mem_limit: 128m
    logging: *logs
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: [--path.rootfs=/host, --collector.textfile.directory=/textfile]
    volumes: ["/:/host:ro,rslave", "./textfile:/textfile:ro"]
    networks: [monitor]
    mem_limit: 64m
    logging: *logs
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data, caddyconfig:/config]
    networks: [edge]
    mem_limit: 128m
    logging: *logs
secrets:
  postgres_password:
    file: /etc/txl/secrets/postgres_password
volumes:
  pgdata:
  valkeydata:
  promdata:
  alertdata:
  caddydata:
  caddyconfig:
networks:
  data:
    internal: true
  monitor:
    internal: true
  edge:
